        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            front/admin/sitmun-admin-app/package-lock.json
            front/viewer/sitmun-viewer-app/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install admin dependencies
        working-directory: front/admin/sitmun-admin-app
        run: npm ci

      - name: Install viewer dependencies
        working-directory: front/viewer/sitmun-viewer-app
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run MIA cross E2E suite
        run: npm run e2e:mia-cross
