name: E2E

on:
  pull_request:
  workflow_dispatch:

jobs:
  e2e-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            front/admin/sitmun-admin-app/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install admin dependencies
        working-directory: front/admin/sitmun-admin-app
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run admin E2E suite
        run: npm run e2e
        env:
          CI: true

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-admin-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e-viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            front/viewer/sitmun-viewer-app/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install viewer dependencies
        working-directory: front/viewer/sitmun-viewer-app
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run viewer E2E suite
        run: npm run e2e:viewer
        env:
          CI: true

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-viewer-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e-application-contact:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            front/admin/sitmun-admin-app/package-lock.json
            front/viewer/sitmun-viewer-app/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install admin dependencies
        working-directory: front/admin/sitmun-admin-app
        run: npm ci

      - name: Install viewer dependencies
        working-directory: front/viewer/sitmun-viewer-app
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run application-contact E2E suite
        run: npx playwright test --config=playwright.application-contact.config.ts
        env:
          CI: true

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-application-contact-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7
