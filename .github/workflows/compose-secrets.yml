name: Compose secrets

on:
  pull_request:
  workflow_dispatch:

jobs:
  compose-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check profile templates and required Compose secrets
        run: bash tools/scripts/check-compose-secrets.sh

      - name: Check setup appends secrets on an existing .env
        run: bash tools/tests/test_setup_compose_secrets.sh
