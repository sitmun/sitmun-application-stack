name: Liquibase upgrade

on:
  pull_request:
    paths:
      - 'profiles/postgres/liquibase/**'
      - 'profiles/oracle/liquibase/**'
      - 'profiles/development/backend/liquibase/**'
      - 'tools/tests/test_liquibase_1.2.7_to_head_upgrade.sh'
      - 'tools/tests/test_liquibase_codelist_auth_mode_swap.sh'
      - 'tools/tests/test_prepare_extracted_liquibase.py'
      - 'tools/bin/prepare_extracted_liquibase.py'
      - '.github/workflows/liquibase-upgrade.yml'
  workflow_dispatch:
    inputs:
      source:
        description: Optional X.Y.Z override for a single postgres-from run
        required: false
        default: ''

jobs:
  prepare-extracted-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extracted-tree helper unit tests
        run: python3 tools/tests/test_prepare_extracted_liquibase.py

  postgres-1-2-7-to-head:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch 1.2.7 and 1.2.8 tags
        run: |
          git fetch --no-tags origin tag sitmun-application-stack/1.2.7
          git fetch --no-tags origin tag sitmun-application-stack/1.2.8

      - name: Upgrade 1.2.7 then 1.2.8 fail then HEAD
        run: bash tools/tests/test_liquibase_1.2.7_to_head_upgrade.sh postgres

  postgres-from:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        source: ['1.2.8']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch source tag
        run: git fetch --no-tags origin tag sitmun-application-stack/${{ matrix.source }}

      - name: Upgrade ${{ matrix.source }} to HEAD
        run: bash tools/tests/test_liquibase_1.2.7_to_head_upgrade.sh postgres-from ${{ matrix.source }}

  postgres-auth-mode-swap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auth-mode COD_ID swap (#45)
        run: bash tools/tests/test_liquibase_codelist_auth_mode_swap.sh

  oracle-from:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        source: ['1.2.6', '1.2.7', '1.2.8']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch source tag
        run: git fetch --no-tags origin tag sitmun-application-stack/${{ matrix.source }}

      - name: Upgrade Oracle ${{ matrix.source }} to HEAD
        run: bash tools/tests/test_liquibase_1.2.7_to_head_upgrade.sh oracle-from ${{ matrix.source }}

  # Issue #74: DIBA runs the oracle profile on 19c, so that upgrade path also has
  # to hold on a pre-23ai server. The development profile stays on Oracle Free.
  # gvenzl/oracle-xe is amd64 only, which the ubuntu-latest runners are.
  oracle-pre23-from:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch 1.2.7 tag
        run: git fetch --no-tags origin tag sitmun-application-stack/1.2.7

      - name: Upgrade Oracle 1.2.7 to HEAD on XE 21
        env:
          SITMUN_ORACLE_IMAGE: gvenzl/oracle-xe:21-slim
        run: bash tools/tests/test_liquibase_1.2.7_to_head_upgrade.sh oracle-from 1.2.7

  dev-oracle-from:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch 1.2.6 tag
        run: git fetch --no-tags origin tag sitmun-application-stack/1.2.6

      - name: Upgrade development Oracle 1.2.6 to HEAD
        run: bash tools/tests/test_liquibase_1.2.7_to_head_upgrade.sh dev-oracle-from 1.2.6
