databaseChangeLog:
  - changeSet:
      id: 59_more_info_advanced_ui_control
      author: sitmun
      context: dev,prod
      preConditions:
        - onFail: MARK_RAN
          sqlCheck:
            expectedResult: 0
            sql: "SELECT COUNT(*) FROM STM_TSK_UI WHERE TUI_NAME = 'sitna.moreInfoAdvanced'"
      changes:
        - sql:
            sql: UPDATE STM_SEQUENCE SET SEQ_COUNT = SEQ_COUNT + 1 WHERE SEQ_NAME = 'TUI_ID';
        - insert:
            tableName: STM_TSK_UI
            columns:
              - column:
                  name: TUI_ID
                  valueComputed: COALESCE((SELECT SEQ_COUNT FROM STM_SEQUENCE WHERE SEQ_NAME = 'TUI_ID'), 100)
              - column:
                  name: TUI_NAME
                  value: "sitna.moreInfoAdvanced"
              - column:
                  name: TUI_TOOLTIP
                  value: "More Info Advanced"
              - column:
                  name: TUI_TYPE
                  value: "moreInfoAdvanced"
              - column:
                  name: TUI_ORDER
                  valueComputed: COALESCE((SELECT SEQ_COUNT FROM STM_SEQUENCE WHERE SEQ_NAME = 'TUI_ID'), 100)
      rollback:
        - delete:
            tableName: STM_TSK_UI
            where: TUI_NAME = 'sitna.moreInfoAdvanced'
