databaseChangeLog:
  - changeSet:
      id: 75-dev-feature-info-fields-postgresql
      author: sitmun
      context: dev
      dbms: postgresql
      comment: >
        IDE genèric Menorca (application 12). Identify Trams del camí de cavalls
        (cartography 1304, layer tu007rts_ccavalls). English labels are PGI_VALUE;
        Spanish and Catalan come from STM_TRANSLATION.
      preConditions:
        - onFail: MARK_RAN
          sqlCheck:
            expectedResult: 1
            sql: >
              SELECT CASE
                WHEN (SELECT COUNT(*) FROM STM_PAR_GI WHERE PGI_ID = 9101) = 0
                 AND (SELECT COUNT(*) FROM STM_GEOINFO WHERE GEO_ID = 1304) = 1
                THEN 1 ELSE 0 END
      changes:
        - sql:
            sql: |
              INSERT INTO STM_PAR_GI (
                PGI_ID, PGI_NAME, PGI_VALUE, PGI_FORMAT, PGI_TYPE, PGI_GIID, PGI_ORDER,
                PGI_DIGITS, PGI_PAD, PGI_DATESTYLE
              ) VALUES
                (9101, 'nomruta', 'Route', 'T', 'INFO', 1304, 0, NULL, NULL, NULL),
                (9102, 'dstipus', 'Kind', 'AUTO', 'INFO', 1304, 1, NULL, NULL, NULL),
                (9103, 'etrsxmax', 'Max easting', 'N', 'INFO', 1304, 2, 0, FALSE, NULL),
                (9104, 'link', 'Website', 'U', 'INFO', 1304, 3, NULL, NULL, NULL);
              INSERT INTO STM_TRANSLATION (TRA_ID, TRA_ELEID, TRA_COLUMN, TRA_LANID, TRA_NAME) VALUES
                (9101001, 9101, 'CartographyParameter.value', 2, 'Ruta'),
                (9101002, 9101, 'CartographyParameter.value', 3, 'Ruta'),
                (9101003, 9102, 'CartographyParameter.value', 2, 'Tipo'),
                (9101004, 9102, 'CartographyParameter.value', 3, 'Tipus'),
                (9101005, 9103, 'CartographyParameter.value', 2, 'Este máximo'),
                (9101006, 9103, 'CartographyParameter.value', 3, 'Est màxim'),
                (9101007, 9104, 'CartographyParameter.value', 2, 'Enlace'),
                (9101008, 9104, 'CartographyParameter.value', 3, 'Enllaç');
              UPDATE STM_SEQUENCE
              SET SEQ_COUNT = GREATEST(SEQ_COUNT, (SELECT COALESCE(MAX(PGI_ID), 0) + 1 FROM STM_PAR_GI))
              WHERE SEQ_NAME = 'PGI_ID';
              UPDATE STM_SEQUENCE
              SET SEQ_COUNT = GREATEST(SEQ_COUNT, (SELECT COALESCE(MAX(TRA_ID), 0) + 1 FROM STM_TRANSLATION))
              WHERE SEQ_NAME = 'TRA_ID';
