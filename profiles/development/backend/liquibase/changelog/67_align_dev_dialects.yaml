databaseChangeLog:
  # Align development h2/postgresql/oracle lengths and FKs (widen-only).
  # Contract: max lengths across dialects/JPA; STM_LOG FKs on h2; STM_APP_BCKG
  # FKs on postgresql; drop legacy h2 TNO_LOADDATA. Do not rewrite 01_schema.
  # Avoid foreignKeyConstraintExists / columnExists (JDBC metadata hangs).

  # ── Length widens: h2 ──────────────────────────────────────────────────────
  - changeSet:
      id: 67-align-bac-name-h2
      author: sitmun
      dbms: h2
      changes:
        - modifyDataType:
            tableName: STM_BACKGRD
            columnName: BAC_NAME
            newDataType: VARCHAR(50)

  - changeSet:
      id: 67-align-pap-name-h2
      author: sitmun
      dbms: h2
      changes:
        - modifyDataType:
            tableName: STM_PAR_APP
            columnName: PAP_NAME
            newDataType: VARCHAR(50)

  # ── Length widens: postgresql ──────────────────────────────────────────────
  - changeSet:
      id: 67-align-app-name-postgresql
      author: sitmun
      dbms: postgresql
      changes:
        - modifyDataType:
            tableName: STM_APP
            columnName: APP_NAME
            newDataType: VARCHAR(80)

  - changeSet:
      id: 67-align-app-project-postgresql
      author: sitmun
      dbms: postgresql
      changes:
        - modifyDataType:
            tableName: STM_APP
            columnName: APP_PROJECT
            newDataType: VARCHAR(250)

  - changeSet:
      id: 67-align-app-type-postgresql
      author: sitmun
      dbms: postgresql
      changes:
        - modifyDataType:
            tableName: STM_APP
            columnName: APP_TYPE
            newDataType: VARCHAR(250)

  - changeSet:
      id: 67-align-geo-source-postgresql
      author: sitmun
      dbms: postgresql
      changes:
        - modifyDataType:
            tableName: STM_GEOINFO
            columnName: GEO_SOURCE
            newDataType: VARCHAR(80)

  - changeSet:
      id: 67-align-tet-name-postgresql
      author: sitmun
      dbms: postgresql
      changes:
        - modifyDataType:
            tableName: STM_TER_TYP
            columnName: TET_NAME
            newDataType: VARCHAR(250)

  - changeSet:
      id: 67-align-pgi-type-postgresql
      author: sitmun
      dbms: postgresql
      changes:
        - modifyDataType:
            tableName: STM_PAR_GI
            columnName: PGI_TYPE
            newDataType: VARCHAR(250)

  # ── Length widens: oracle ──────────────────────────────────────────────────
  - changeSet:
      id: 67-align-app-name-oracle
      author: sitmun
      dbms: oracle
      changes:
        - modifyDataType:
            tableName: STM_APP
            columnName: APP_NAME
            newDataType: VARCHAR2(80 CHAR)

  - changeSet:
      id: 67-align-app-project-oracle
      author: sitmun
      dbms: oracle
      changes:
        - modifyDataType:
            tableName: STM_APP
            columnName: APP_PROJECT
            newDataType: VARCHAR2(250 CHAR)

  - changeSet:
      id: 67-align-app-type-oracle
      author: sitmun
      dbms: oracle
      changes:
        - modifyDataType:
            tableName: STM_APP
            columnName: APP_TYPE
            newDataType: VARCHAR2(250 CHAR)

  - changeSet:
      id: 67-align-geo-source-oracle
      author: sitmun
      dbms: oracle
      changes:
        - modifyDataType:
            tableName: STM_GEOINFO
            columnName: GEO_SOURCE
            newDataType: VARCHAR2(80 CHAR)

  - changeSet:
      id: 67-align-tet-name-oracle
      author: sitmun
      dbms: oracle
      changes:
        - modifyDataType:
            tableName: STM_TER_TYP
            columnName: TET_NAME
            newDataType: VARCHAR2(250 CHAR)

  - changeSet:
      id: 67-align-pgi-type-oracle
      author: sitmun
      dbms: oracle
      changes:
        - modifyDataType:
            tableName: STM_PAR_GI
            columnName: PGI_TYPE
            newDataType: VARCHAR2(250 CHAR)

  # ── h2: drop legacy TNO_LOADDATA (JPA uses TNO_LOAD_DATA) ───────────────────
  - changeSet:
      id: 67-drop-tno-loaddata-h2
      author: sitmun
      dbms: h2
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - sqlCheck:
            expectedResult: 1
            sql: >-
              SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS
              WHERE UPPER(TABLE_NAME) = 'STM_TREE_NOD'
                AND UPPER(COLUMN_NAME) = 'TNO_LOADDATA'
      changes:
        - dropColumn:
            tableName: STM_TREE_NOD
            columnName: TNO_LOADDATA

  # ── h2: STM_LOG FKs (absent in 01_schema.h2) ───────────────────────────────
  - changeSet:
      id: 67-align-stm-log-fk-appid-h2
      author: sitmun
      dbms: h2
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: >-
              SELECT COUNT(*) FROM INFORMATION_SCHEMA.TABLE_CONSTRAINTS
              WHERE UPPER(CONSTRAINT_NAME) = 'STM_LOG_FK_APPID'
      changes:
        - addForeignKeyConstraint:
            constraintName: STM_LOG_FK_APPID
            baseTableName: STM_LOG
            baseColumnNames: LOG_APPID
            referencedTableName: STM_APP
            referencedColumnNames: APP_ID

  - changeSet:
      id: 67-align-stm-log-fk-giid-h2
      author: sitmun
      dbms: h2
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: >-
              SELECT COUNT(*) FROM INFORMATION_SCHEMA.TABLE_CONSTRAINTS
              WHERE UPPER(CONSTRAINT_NAME) = 'STM_LOG_FK_GIID'
      changes:
        - addForeignKeyConstraint:
            constraintName: STM_LOG_FK_GIID
            baseTableName: STM_LOG
            baseColumnNames: LOG_GIID
            referencedTableName: STM_GEOINFO
            referencedColumnNames: GEO_ID

  - changeSet:
      id: 67-align-stm-log-fk-taskid-h2
      author: sitmun
      dbms: h2
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: >-
              SELECT COUNT(*) FROM INFORMATION_SCHEMA.TABLE_CONSTRAINTS
              WHERE UPPER(CONSTRAINT_NAME) = 'STM_LOG_FK_TASKID'
      changes:
        - addForeignKeyConstraint:
            constraintName: STM_LOG_FK_TASKID
            baseTableName: STM_LOG
            baseColumnNames: LOG_TASKID
            referencedTableName: STM_TASK
            referencedColumnNames: TAS_ID

  - changeSet:
      id: 67-align-stm-log-fk-terid-h2
      author: sitmun
      dbms: h2
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: >-
              SELECT COUNT(*) FROM INFORMATION_SCHEMA.TABLE_CONSTRAINTS
              WHERE UPPER(CONSTRAINT_NAME) = 'STM_LOG_FK_TERID'
      changes:
        - addForeignKeyConstraint:
            constraintName: STM_LOG_FK_TERID
            baseTableName: STM_LOG
            baseColumnNames: LOG_TERID
            referencedTableName: STM_TERRITORY
            referencedColumnNames: TER_ID

  - changeSet:
      id: 67-align-stm-log-fk-userid-h2
      author: sitmun
      dbms: h2
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: >-
              SELECT COUNT(*) FROM INFORMATION_SCHEMA.TABLE_CONSTRAINTS
              WHERE UPPER(CONSTRAINT_NAME) = 'STM_LOG_FK_USERID'
      changes:
        - addForeignKeyConstraint:
            constraintName: STM_LOG_FK_USERID
            baseTableName: STM_LOG
            baseColumnNames: LOG_USERID
            referencedTableName: STM_USER
            referencedColumnNames: USE_ID

  # ── postgresql: STM_APP_BCKG FKs (present on h2/oracle 01, missing on pg) ──
  - changeSet:
      id: 67-align-stm-abc-fk-app-postgresql
      author: sitmun
      dbms: postgresql
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: >-
              SELECT COUNT(*) FROM pg_constraint
              WHERE upper(conname) = 'STM_ABC_FK_APP'
      changes:
        - addForeignKeyConstraint:
            constraintName: STM_ABC_FK_APP
            baseTableName: STM_APP_BCKG
            baseColumnNames: ABC_APPID
            referencedTableName: STM_APP
            referencedColumnNames: APP_ID
            onDelete: CASCADE

  - changeSet:
      id: 67-align-stm-abc-fk-fon-postgresql
      author: sitmun
      dbms: postgresql
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: >-
              SELECT COUNT(*) FROM pg_constraint
              WHERE upper(conname) = 'STM_ABC_FK_FON'
      changes:
        - addForeignKeyConstraint:
            constraintName: STM_ABC_FK_FON
            baseTableName: STM_APP_BCKG
            baseColumnNames: ABC_BACKID
            referencedTableName: STM_BACKGRD
            referencedColumnNames: BAC_ID
            onDelete: CASCADE
