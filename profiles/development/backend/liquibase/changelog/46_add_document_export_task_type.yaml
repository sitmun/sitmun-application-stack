  - changeSet:
      id: 46b_document_export_codelists
      author: sitmun
      context: dev,prod
      changes:
        - sql:
            sql: >
              INSERT INTO STM_CODELIST (COD_ID, COD_LIST, COD_VALUE, COD_SYSTEM, COD_DEFAULT, COD_DESCRIPTION)
              SELECT (SELECT COALESCE(MAX(COD_ID), 0) + 1 FROM STM_CODELIST), 'documentExport.engine', 'openhtmltopdf', TRUE, TRUE, 'OpenHTMLToPDF'
              WHERE NOT EXISTS (SELECT 1 FROM STM_CODELIST WHERE COD_LIST = 'documentExport.engine' AND COD_VALUE = 'openhtmltopdf');
        - sql:
            sql: >
              INSERT INTO STM_CODELIST (COD_ID, COD_LIST, COD_VALUE, COD_SYSTEM, COD_DEFAULT, COD_DESCRIPTION)
              SELECT (SELECT COALESCE(MAX(COD_ID), 0) + 1 FROM STM_CODELIST), 'documentExport.output', 'pdf', TRUE, TRUE, 'PDF'
              WHERE NOT EXISTS (SELECT 1 FROM STM_CODELIST WHERE COD_LIST = 'documentExport.output' AND COD_VALUE = 'pdf');
        - sql:
            sql: >
              UPDATE STM_SEQUENCE
              SET SEQ_COUNT = (SELECT COALESCE(MAX(COD_ID), 0) + 1 FROM STM_CODELIST)
              WHERE SEQ_NAME = 'COD_ID';
      rollback:
        - sql:
            sql: >
              DELETE FROM STM_CODELIST
              WHERE (COD_LIST = 'documentExport.engine' AND COD_VALUE = 'openhtmltopdf')
                 OR (COD_LIST = 'documentExport.output' AND COD_VALUE = 'pdf');
  - changeSet:
