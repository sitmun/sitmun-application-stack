databaseChangeLog:
  - changeSet:
      id: 60_more_info_advanced_task_type
      author: sitmun
      context: dev,prod
      preConditions:
        - onFail: MARK_RAN
          sqlCheck:
            expectedResult: 0
            sql: "SELECT COUNT(*) FROM STM_TSK_TYP WHERE TTY_ID = 16"
      changes:
        - insert:
            tableName: STM_TSK_TYP
            columns:
              - column: { name: TTY_ID, valueNumeric: 16 }
              - column: { name: TTY_NAME, value: "moreInfoAdvanced" }
              - column: { name: TTY_TITLE, value: "More Info Advanced" }
              - column: { name: TTY_ENABLED, valueBoolean: true }
              - column: { name: TTY_ORDER, valueNumeric: 16 }
        - sql:
            sql: >
              UPDATE STM_SEQUENCE
              SET SEQ_COUNT = (SELECT COALESCE(MAX(TTY_ID), 0) + 1 FROM STM_TSK_TYP)
              WHERE SEQ_NAME = 'TTY_ID';
      rollback:
        - delete:
            tableName: STM_TSK_TYP
            where: TTY_ID = 16
