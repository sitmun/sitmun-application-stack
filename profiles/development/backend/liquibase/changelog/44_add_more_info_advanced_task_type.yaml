databaseChangeLog:
  - changeSet:
      id: 44_more_info_advanced_task_type
      author: sitmun
      context: dev,prod
      preConditions:
        - onFail: MARK_RAN
          sqlCheck:
            expectedResult: 0
            sql: "SELECT COUNT(*) FROM STM_TSK_TYP WHERE TTY_ID = 16"
      changes:
        - insert:
            tableName: STM_TSK_TYP
            columns:
              - column: { name: TTY_ID, valueNumeric: 16 }
              - column: { name: TTY_NAME, value: "moreInfoAdvanced" }
              - column: { name: TTY_TITLE, value: "More Info Advanced" }
              - column: { name: TTY_ENABLED, valueBoolean: true }
              - column: { name: TTY_ORDER, valueNumeric: 17 }
        - update:
            tableName: STM_TSK_TYP
            columns:
              - column:
                  name: TTY_SPEC
                  valueClobFile: 44_add_more_info_advanced_task_type/16_MoreInfoAdvancedTaskDefinition.json
            where: TTY_ID = 16
      rollback:
        - delete:
            tableName: STM_TSK_TYP
            where: TTY_ID = 16
  - changeSet:
      id: 44b
      author: sitmun
      context: dev,prod
      changes:
        - sql:
            sql: >
              UPDATE STM_SEQUENCE
              SET SEQ_COUNT = (SELECT COALESCE(MAX(TTY_ID), 0) + 1 FROM STM_TSK_TYP)
              WHERE SEQ_NAME = 'TTY_ID';
      rollback:
        - sql:
            sql: "UPDATE STM_SEQUENCE SET SEQ_COUNT = 16 WHERE SEQ_NAME = 'TTY_ID';"
