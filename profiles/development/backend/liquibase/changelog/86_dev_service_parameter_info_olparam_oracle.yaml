databaseChangeLog:
  - changeSet:
      id: 86-dev-service-parameter-info-olparam-oracle
      author: sitmun
      context: dev
      dbms: oracle
      changes:
        - sql:
            sql: >
              INSERT INTO STM_CODELIST (COD_ID, COD_LIST, COD_VALUE, COD_SYSTEM, COD_DEFAULT, COD_DESCRIPTION)
              SELECT (SELECT COALESCE(MAX(COD_ID), 0) + 1 FROM STM_CODELIST),
                     'serviceParameter.type', 'INFO', 0, 0, 'GetFeatureInfo'
              FROM DUAL
              WHERE NOT EXISTS (
                SELECT 1 FROM STM_CODELIST
                WHERE COD_LIST = 'serviceParameter.type' AND COD_VALUE = 'INFO'
              );
        - sql:
            sql: >
              INSERT INTO STM_CODELIST (COD_ID, COD_LIST, COD_VALUE, COD_SYSTEM, COD_DEFAULT, COD_DESCRIPTION)
              SELECT (SELECT COALESCE(MAX(COD_ID), 0) + 1 FROM STM_CODELIST),
                     'serviceParameter.type', 'OLPARAM', 0, 0, 'OpenLayers'
              FROM DUAL
              WHERE NOT EXISTS (
                SELECT 1 FROM STM_CODELIST
                WHERE COD_LIST = 'serviceParameter.type' AND COD_VALUE = 'OLPARAM'
              );
        - sql:
            sql: >
              UPDATE STM_SEQUENCE
              SET SEQ_COUNT = (SELECT COALESCE(MAX(COD_ID), 0) + 1 FROM STM_CODELIST)
              WHERE SEQ_NAME = 'COD_ID';
        - sql:
            sql: |
              INSERT INTO STM_TRANSLATION (TRA_ID, TRA_ELEID, TRA_COLUMN, TRA_LANID, TRA_NAME)
              SELECT (SELECT COALESCE(MAX(TRA_ID), 0) + 1 FROM STM_TRANSLATION),
                     c.COD_ID, 'CodeListValue.description', 2, 'GetFeatureInfo'
              FROM STM_CODELIST c
              WHERE c.COD_LIST = 'serviceParameter.type' AND c.COD_VALUE = 'INFO'
                AND NOT EXISTS (
                  SELECT 1 FROM STM_TRANSLATION t
                  WHERE t.TRA_ELEID = c.COD_ID AND t.TRA_LANID = 2
                    AND t.TRA_COLUMN IN ('description', 'CodeListValue.description')
                );
              INSERT INTO STM_TRANSLATION (TRA_ID, TRA_ELEID, TRA_COLUMN, TRA_LANID, TRA_NAME)
              SELECT (SELECT COALESCE(MAX(TRA_ID), 0) + 1 FROM STM_TRANSLATION),
                     c.COD_ID, 'CodeListValue.description', 3, 'GetFeatureInfo'
              FROM STM_CODELIST c
              WHERE c.COD_LIST = 'serviceParameter.type' AND c.COD_VALUE = 'INFO'
                AND NOT EXISTS (
                  SELECT 1 FROM STM_TRANSLATION t
                  WHERE t.TRA_ELEID = c.COD_ID AND t.TRA_LANID = 3
                    AND t.TRA_COLUMN IN ('description', 'CodeListValue.description')
                );
              INSERT INTO STM_TRANSLATION (TRA_ID, TRA_ELEID, TRA_COLUMN, TRA_LANID, TRA_NAME)
              SELECT (SELECT COALESCE(MAX(TRA_ID), 0) + 1 FROM STM_TRANSLATION),
                     c.COD_ID, 'CodeListValue.description', 4, 'GetFeatureInfo'
              FROM STM_CODELIST c
              WHERE c.COD_LIST = 'serviceParameter.type' AND c.COD_VALUE = 'INFO'
                AND NOT EXISTS (
                  SELECT 1 FROM STM_TRANSLATION t
                  WHERE t.TRA_ELEID = c.COD_ID AND t.TRA_LANID = 4
                    AND t.TRA_COLUMN IN ('description', 'CodeListValue.description')
                );
              INSERT INTO STM_TRANSLATION (TRA_ID, TRA_ELEID, TRA_COLUMN, TRA_LANID, TRA_NAME)
              SELECT (SELECT COALESCE(MAX(TRA_ID), 0) + 1 FROM STM_TRANSLATION),
                     c.COD_ID, 'CodeListValue.description', 5, 'GetFeatureInfo'
              FROM STM_CODELIST c
              WHERE c.COD_LIST = 'serviceParameter.type' AND c.COD_VALUE = 'INFO'
                AND NOT EXISTS (
                  SELECT 1 FROM STM_TRANSLATION t
                  WHERE t.TRA_ELEID = c.COD_ID AND t.TRA_LANID = 5
                    AND t.TRA_COLUMN IN ('description', 'CodeListValue.description')
                );
              INSERT INTO STM_TRANSLATION (TRA_ID, TRA_ELEID, TRA_COLUMN, TRA_LANID, TRA_NAME)
              SELECT (SELECT COALESCE(MAX(TRA_ID), 0) + 1 FROM STM_TRANSLATION),
                     c.COD_ID, 'CodeListValue.description', 2, 'OpenLayers'
              FROM STM_CODELIST c
              WHERE c.COD_LIST = 'serviceParameter.type' AND c.COD_VALUE = 'OLPARAM'
                AND NOT EXISTS (
                  SELECT 1 FROM STM_TRANSLATION t
                  WHERE t.TRA_ELEID = c.COD_ID AND t.TRA_LANID = 2
                    AND t.TRA_COLUMN IN ('description', 'CodeListValue.description')
                );
              INSERT INTO STM_TRANSLATION (TRA_ID, TRA_ELEID, TRA_COLUMN, TRA_LANID, TRA_NAME)
              SELECT (SELECT COALESCE(MAX(TRA_ID), 0) + 1 FROM STM_TRANSLATION),
                     c.COD_ID, 'CodeListValue.description', 3, 'OpenLayers'
              FROM STM_CODELIST c
              WHERE c.COD_LIST = 'serviceParameter.type' AND c.COD_VALUE = 'OLPARAM'
                AND NOT EXISTS (
                  SELECT 1 FROM STM_TRANSLATION t
                  WHERE t.TRA_ELEID = c.COD_ID AND t.TRA_LANID = 3
                    AND t.TRA_COLUMN IN ('description', 'CodeListValue.description')
                );
              INSERT INTO STM_TRANSLATION (TRA_ID, TRA_ELEID, TRA_COLUMN, TRA_LANID, TRA_NAME)
              SELECT (SELECT COALESCE(MAX(TRA_ID), 0) + 1 FROM STM_TRANSLATION),
                     c.COD_ID, 'CodeListValue.description', 4, 'OpenLayers'
              FROM STM_CODELIST c
              WHERE c.COD_LIST = 'serviceParameter.type' AND c.COD_VALUE = 'OLPARAM'
                AND NOT EXISTS (
                  SELECT 1 FROM STM_TRANSLATION t
                  WHERE t.TRA_ELEID = c.COD_ID AND t.TRA_LANID = 4
                    AND t.TRA_COLUMN IN ('description', 'CodeListValue.description')
                );
              INSERT INTO STM_TRANSLATION (TRA_ID, TRA_ELEID, TRA_COLUMN, TRA_LANID, TRA_NAME)
              SELECT (SELECT COALESCE(MAX(TRA_ID), 0) + 1 FROM STM_TRANSLATION),
                     c.COD_ID, 'CodeListValue.description', 5, 'OpenLayers'
              FROM STM_CODELIST c
              WHERE c.COD_LIST = 'serviceParameter.type' AND c.COD_VALUE = 'OLPARAM'
                AND NOT EXISTS (
                  SELECT 1 FROM STM_TRANSLATION t
                  WHERE t.TRA_ELEID = c.COD_ID AND t.TRA_LANID = 5
                    AND t.TRA_COLUMN IN ('description', 'CodeListValue.description')
                );
              UPDATE STM_SEQUENCE
              SET SEQ_COUNT = (SELECT COALESCE(MAX(TRA_ID), 0) + 1 FROM STM_TRANSLATION)
              WHERE SEQ_NAME = 'TRA_ID';
