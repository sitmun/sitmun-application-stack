databaseChangeLog:
  - changeSet:
      id: 52-add-tno-default-h2
      author: sitmun
      dbms: h2
      context: dev,prod
      preConditions:
        - onFail: MARK_RAN
        - not:
            columnExists:
              tableName: STM_TREE_NOD
              columnName: TNO_DEFAULT
      changes:
        - addColumn:
            tableName: STM_TREE_NOD
            columns:
              - column:
                  name: TNO_DEFAULT
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

  - changeSet:
      id: 52-add-tno-default-postgresql
      author: sitmun
      dbms: postgresql
      context: dev,prod
      preConditions:
        - onFail: MARK_RAN
        - not:
            columnExists:
              tableName: STM_TREE_NOD
              columnName: TNO_DEFAULT
      changes:
        - addColumn:
            tableName: STM_TREE_NOD
            columns:
              - column:
                  name: TNO_DEFAULT
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

  - changeSet:
      id: 52-add-tno-default-oracle
      author: sitmun
      dbms: oracle
      context: dev,prod
      preConditions:
        - onFail: MARK_RAN
        - not:
            columnExists:
              tableName: STM_TREE_NOD
              columnName: TNO_DEFAULT
      changes:
        - sql:
            sql: ALTER TABLE STM_TREE_NOD ADD TNO_DEFAULT NUMBER(1,0) DEFAULT 0 NOT NULL
