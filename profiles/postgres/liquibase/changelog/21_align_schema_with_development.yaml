  # Widens after development 68 (APP/GEO/TET lengths). No columnExists — JDBC
  # metadata snapshots can hang; changeset IDs provide once-only apply.

  - changeSet:
      id: 21-align-app-name-postgresql
      author: sitmun
      dbms: postgresql
      changes:
        - modifyDataType:
            tableName: STM_APP
            columnName: APP_NAME
            newDataType: VARCHAR(80)

