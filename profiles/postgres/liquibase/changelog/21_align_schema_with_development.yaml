      changes:
        - modifyDataType:
            tableName: STM_STY_GI
            columnName: SGI_LURL_FORMAT
            newDataType: VARCHAR(255)

  - changeSet:
      id: 21-align-stm-log-fk-appid-postgresql
      author: sitmun
      dbms: postgresql
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - not:
            foreignKeyConstraintExists:
              foreignKeyName: STM_LOG_FK_APPID
      changes:
        - addForeignKeyConstraint:
            constraintName: STM_LOG_FK_APPID
            baseTableName: STM_LOG
            baseColumnNames: LOG_APPID
            referencedTableName: STM_APP
            referencedColumnNames: APP_ID

  - changeSet:
      id: 21-align-stm-log-fk-giid-postgresql
      author: sitmun
      dbms: postgresql
      preConditions:
