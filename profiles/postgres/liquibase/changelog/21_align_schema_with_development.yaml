databaseChangeLog:
  # Align production postgres schema lengths/FKs with development Liquibase.
  # Do not rewrite sitmun:1. Idempotent via preConditions → MARK_RAN.

  - changeSet:
      id: 21-align-fgi-valuetype-postgresql
      author: sitmun
      dbms: postgresql
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - columnExists:
            tableName: STM_FIL_GI
            columnName: FGI_VALUETYPE
      changes:
        - modifyDataType:
            tableName: STM_FIL_GI
            columnName: FGI_VALUETYPE
            newDataType: VARCHAR(50)

  - changeSet:
      id: 21-align-geo-type-postgresql
      author: sitmun
      dbms: postgresql
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - columnExists:
            tableName: STM_GEOINFO
            columnName: GEO_TYPE
      changes:
        - modifyDataType:
            tableName: STM_GEOINFO
            columnName: GEO_TYPE
            newDataType: VARCHAR(50)

  - changeSet:
      id: 21-align-ggi-type-postgresql
      author: sitmun
      dbms: postgresql
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - columnExists:
            tableName: STM_GRP_GI
            columnName: GGI_TYPE
      changes:
        - modifyDataType:
            tableName: STM_GRP_GI
