databaseChangeLog:
  - changeSet:
      id: 25_default_template_regions
      author: sitmun
      context: dev,prod
      dbms: oracle
      changes:
        - sql:
            sql: |
              INSERT INTO STM_TASK (TAS_ID, TAS_NAME, TAS_GTASKID, TAS_TTASKID, TAS_PARAMS)
              SELECT next_id, 'Capçalera per defecte', 1, 15, q'[ {"parameters":[],"templateHtml":"<table class=\"sitmun-pdf-header-full-bleed\" style=\"width:100%;background-color:#FF9300;border-collapse:collapse\"><tbody><tr><td style=\"width:33%;text-align:left\"><img src=\"data:image/png;base64,\" alt=\"SITMUN\" style=\"max-width:180px\"></td><td style=\"width:34%;text-align:center\">Capçalera per defecte</td><td style=\"width:33%;text-align:right\">{{currentDate}}</td></tr></tbody></table>"} ]'
              FROM (SELECT COALESCE(MAX(TAS_ID), 0) + 1 AS next_id FROM STM_TASK) ids WHERE NOT EXISTS (SELECT 1 FROM STM_TASK WHERE TAS_NAME = 'Capçalera per defecte' AND TAS_TTASKID = 15);
              INSERT INTO STM_TASK (TAS_ID, TAS_NAME, TAS_GTASKID, TAS_TTASKID, TAS_PARAMS)
              SELECT next_id, 'Peu de pàgina per defecte', 1, 15, q'[ {"parameters":[],"templateHtml":"<table class=\"sitmun-pdf-footer-full-bleed\" style=\"width:100%;border-collapse:collapse\"><tbody><tr><td style=\"width:25%;text-align:left\">&nbsp;</td><td style=\"width:50%;text-align:center\">Peu de pàgina per defecte</td><td style=\"width:25%;text-align:right;padding-right:8mm\"><p class=\"sitmun-pdf-page-number\">&nbsp;</p></td></tr></tbody></table>"} ]'
              FROM (SELECT COALESCE(MAX(TAS_ID), 0) + 1 AS next_id FROM STM_TASK) ids WHERE NOT EXISTS (SELECT 1 FROM STM_TASK WHERE TAS_NAME = 'Peu de pàgina per defecte' AND TAS_TTASKID = 15);
              UPDATE STM_SEQUENCE SET SEQ_COUNT = (SELECT COALESCE(MAX(TAS_ID), 0) + 1 FROM STM_TASK) WHERE SEQ_NAME = 'TAS_ID';
