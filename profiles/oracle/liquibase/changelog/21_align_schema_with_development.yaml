databaseChangeLog:
  # Align production oracle schema lengths/FKs with development Liquibase.
  # Do not rewrite sitmun:1. Idempotent via preConditions → MARK_RAN.

  - changeSet:
      id: 21-align-bac-name-oracle
      author: sitmun
      dbms: oracle
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - columnExists:
            tableName: STM_BACKGRD
            columnName: BAC_NAME
      changes:
        - modifyDataType:
            tableName: STM_BACKGRD
            columnName: BAC_NAME
            newDataType: VARCHAR2(50 CHAR)

