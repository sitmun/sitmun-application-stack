      id: 29-parameter-operation-scope-descriptions
      author: sitmun
      changes:
        - sql:
            sql: >
              UPDATE STM_CODELIST SET COD_DESCRIPTION = 'All WMS operations'
                            WHERE COD_VALUE = 'WMS'
                              AND COD_LIST IN ('serviceParameter.type', 'cartographyServiceParameter.type')
        - sql:
            sql: >
              UPDATE STM_CODELIST SET COD_DESCRIPTION = 'GetFeatureInfo'
                            WHERE COD_VALUE = 'INFO'
                              AND COD_LIST IN ('serviceParameter.type', 'cartographyServiceParameter.type')
        - sql:
            sql: >
              UPDATE STM_CODELIST SET COD_DESCRIPTION = 'Viewer tile settings'
                            WHERE COD_VALUE = 'WMTS'
